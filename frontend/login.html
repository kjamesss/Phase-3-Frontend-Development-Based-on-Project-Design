<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | BU Task Planner</title>
    <link rel="icon" href="img/mark.png">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/bootstrap.bundle.min.js" defer></script>
    <script src="js/api-placeholder.js" defer></script>
    <script src="js/ui.js" defer></script>
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>
    <header><nav class="navbar navbar-expand-md" aria-label="Main navigation"><div class="container">
        <a class="navbar-brand" href="index.html"><img src="img/mark.png" width="36" height="36" alt=""> BU Task Planner</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="main-nav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link active" aria-current=page href="login.html">Log in</a></li><li class="nav-item"><a class="nav-link"  href="register.html">Register</a></li></ul></div>
    </div></nav></header>
    <main id="main" class="container page auth-page" tabindex="-1">

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 col-xl-5">
                <section class="card auth-card">
                    <h1>Log in</h1><p class="text-secondary">Access your tasks and upcoming deadlines.</p>
                    <form id="login" action="#" method="POST" data-api-placeholder class="form-stack">
                        
                        <div><label class="form-label" for="login-email">Email address</label>
        <input class="form-control" type="email" id="login-email" name="email" required autocomplete="username"></div>
                        <div><label class="form-label" for="login-password">Password</label>
        <input class="form-control" type="password" id="login-password" name="password" required autocomplete="current-password"></div>
                        <button class="btn btn-primary" type="submit">Log in</button><div class="form-feedback alert alert-info d-none" role="status"></div>
                    </form>
                    <p class="auth-switch">New to BU Task Planner? <a href="register.html">Create an account</a></p>
                </section>
                <p class="preview-note">Phase 3 form preview. Use the <a href="dashboard.html">student demo</a> to explore the workspace.</p>
            </div>
        </div>
    </main>
    <footer class="site-footer"><div class="container footer-inner">
        <span>Bicol University Polangui</span><span>IT 112 <span aria-hidden="true">·</span> Group 5 <span aria-hidden="true">·</span> Phase 3 prototype</span>
    </div></footer>

</body>
</html>
