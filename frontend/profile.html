<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile | BU Task Planner</title>
    <link rel="icon" href="img/mark.png">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/bootstrap.bundle.min.js" defer></script>
    <script src="js/api-placeholder.js" defer></script>
    <script src="js/ui.js" defer></script>
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>
    <header><nav class="navbar navbar-expand-md" aria-label="Main navigation"><div class="container">
        <a class="navbar-brand" href="index.html"><img src="img/mark.png" width="36" height="36" alt=""> BU Task Planner</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="main-nav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link"  href="dashboard.html">Dashboard</a></li><li class="nav-item"><a class="nav-link"  href="tasks.html">Tasks</a></li><li class="nav-item"><a class="nav-link active" aria-current=page href="profile.html">Profile</a></li><li class="nav-item"><a class="nav-link" href="index.html">Exit demo</a></li></ul></div>
    </div></nav></header>
    <main id="main" class="container page " tabindex="-1">
<div class="page-heading"><div><h1>Profile</h1><p>Review your student account details.</p></div></div>
        <div class="row g-4">
            <div class="col-lg-7">
                <section class="card form-panel">
                    <h2>Account details</h2>
                    <form id="profile" action="#" method="POST" data-api-placeholder class="form-stack">
                        <div><label class="form-label" for="profile-name">Full name</label>
        <input class="form-control" type="text" id="profile-name" name="name" required autocomplete="name" value="Alex Reyes"></div>
                        <div><label class="form-label" for="profile-email">Email address</label>
        <input class="form-control" type="email" id="profile-email" name="email" required autocomplete="email" value="alex.reyes@example.test"></div>
                        <div><button class="btn btn-primary" type="submit">Save changes</button></div><div class="form-feedback alert alert-info d-none" role="status"></div>
                    </form>
                </section>
            </div>
            <div class="col-lg-5">
                <section class="card form-panel">
                    <h2>Account summary</h2>
                    <dl class="account-facts">
                        <div><dt>Role</dt><dd>Student</dd></div>
                        <div><dt>Joined</dt><dd>October 2026</dd></div>
                    </dl>
                    <p class="section-note mb-0">This profile uses sample account data.</p>
                </section>
            </div>
        </div>
    </main>
    <footer class="site-footer"><div class="container footer-inner">
        <span>Bicol University Polangui</span><span>IT 112 <span aria-hidden="true">·</span> Group 5 <span aria-hidden="true">·</span> Phase 3 prototype</span>
    </div></footer>

</body>
</html>
